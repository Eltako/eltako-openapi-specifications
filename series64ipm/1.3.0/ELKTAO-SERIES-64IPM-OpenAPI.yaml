externalDocs:
  description: Find more information on ELTAKO profissonal smart home devices here.
  url: https://www.eltako.com/en/product-category/professional-smart-home-en
info:
  contact:
    email: info@eltako.com
    name: Eltako GmbH
    url: https://www.eltako.com/en/company/contact/
  description: "## Introduction\n\nThe ELTAKO SERIES 62-IP, 62-IPM & 64-IPM combine\
    \ the latest switching and control technology with innovative connectivity and\
    \ functionality.\nThis documentation covers the SERIES 62-IP, 62-IPM & 64-IPM\
    \ REST API, demonstrating how these products can be used/configured via HTTP requests.\n\
    For readability, this document will use \"SERIES 64-IPM\" to refer to all these\
    \ devices.\n\nAll responses are in [JSON](https://www.ecma-international.org/publications-and-standards/standards/ecma-404/)\
    \ format.\n\n## Supported devices\n- ESB62NP-IP/110-240V\n- ESR62NP-IP/110-240V\n\
    - ESR62PF-IP/110-240V\n- EUD62NPN-IP/110-240V\n- EUD62NPN-IPM/110-240V\n- ESB64NP-IPM\n\
    - ESR64NP-IPM\n- ESR64PF-IPM\n- EUD64NPN-IPM\n\n## Getting started\n\n### Test\
    \ environment\n#### Postman\nPostman supports OpenAPI 3.1 documents.\nTo use it:\n\
    1. Import this OpenAPI documentation into [Postman](https://www.postman.com/).\n\
    \    A guide can be found [here](https://learning.postman.com/docs/getting-started/importing-and-exporting-data/#importing-data-into-postman).\n\
    2. Use the import option \"OpenAPI 3.1 with a Postman Collection\".\n    Enable\
    \ \"Always inherit authentication\" in the import settings.\n3. Go to the imported\
    \ collection named \"SERIES 62-IP, 62-IPM & 64-IPM API Doc\" and follow the `/login`\
    \ endpoint instructions to get the API key.\n4. Click on the Authorization tab\
    \ of the collection, select the `API key` type, set the Key to `Authorization`\
    \ and the Value to the apiKey from the `/login` endpoint.\n5. All other endpoints\
    \ are now authorized for use.\n\n#### Alternative Tooling\nDirect calls using\
    \ tools like [curl](https://curl.se/) are also possible.\n\n### Parameters\n\n\
    This documentation mentions parameters required for executing and manipulating\
    \ HTTP Requests.\nThese parameters must be set by the user to get a valid response\
    \ and are defined in the `parameters` section of this document.\n\n### Authorization\n\
    \nMost endpoints require authentication.\nUsers must log in to the SERIES 64-IPM\
    \ with their username and password to obtain an api-key (see the `login` endpoint).\n\
    This api-key can then be used to authenticate the user.\n\n### API version\n\n\
    This API uses the [Semantic Version scheme](https://semver.org/) for versioning.\n\
    The major version is indicated within the URI of versioned requests.\n\n### List\
    \ of abbreviations\n- HAP - [Homekit Accessory Protocol](https://developer.apple.com/apple-home/)\n\
    \n### Errors\n\nErrors are structured as specified in [RFC 7807](https://www.rfc-editor.org/rfc/rfc7807)."
  license:
    name: MIT
    url: https://opensource.org/license/mit
  summary: ELTAKO SERIES 64-IPM API Documentation
  title: ELTAKO SERIES 62-IP, 62-IPM & 64-IPM OpenAPI Documentation
  version: 1.3.0
