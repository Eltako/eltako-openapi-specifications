  /services/actuator/devices:
    get:
      description: Get all actuator hardware configurations. This includes configurations
        that are currently blocked by active configurations. A hardware configuration
        becomes active by linking it to a device. Unlinking a device will make the
        associated hardware available again. The blockedBy field indicates which hardware
