      properties:
        dimDuration:
          description: Time im milli-seconds it takes for a full cylce dimming from
            0% - 100%./nThis will be used to determine at which speed the dimmer should
            move towards the maximum brightness value when long pressing the input
            device
          examples:
          - 7000
          maximum: 4294967295
          minimum: 200
          type: number
        slumberExtension:
          description: This attribute is used to configure the slumber function./nThis
            function is triggered when the dimmer is on and the user performs a double
            click action./nThe dimmer will dim towards the desired targetBrightness
            with the provided dimDuration
          examples:
          - dimDuration: 1800000
            enabled: true
          properties:
            dimDuration:
              description: Time im ms it takes for a full cylce dimming from 0% -
                100%./nThis will be used to determine at which speed the dimmer should
                move towards the desired brightness value when activating the slumber
                function
              examples:
              - 1800000
              maximum: 4294967295
              minimum: 200
              type: number
            enabled:
              description: Boolean attribute to select whether this function is to
                be activated or not
              examples:
              - true
              type: boolean
          type: object
        turnOffDuration:
          description: Time in milli-seconds it takes for a full cycle dimming from
            100% - 0%./nThis will be used to determine how fast the dimmer should
            turn off after clicking
          examples:
          - 2000
          maximum: 4294967295
          minimum: 200
          type: number
      type: object
    DirectionalUpButtonDimmerLogicConfiguration:
      description: With the directional up button, the light dims up to the stored
        targetBrightness by briefly pressing the button./nLong button presses dim
        the device further towards the maximumBrightness./nSupported extensions are
