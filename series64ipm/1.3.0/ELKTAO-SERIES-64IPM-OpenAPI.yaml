  /login:
    post:
      description: 'For security reasons, most endpoints require an API key for authorization.


        **Such keys are reusable, and can not be deleted by the user (without resetting
        the device completely), so they should be treated as passwords!

        Currently the device only supports up to 10 API keys.

        If an 11th API key is requested, the first one is revoked and deleted!**


        To create an API key the proof of possession (PoP) is required, which can
        be found on the ELTAKO code of the device.

        For identification, a username must also be submitted, but currently the only
        valid user is `admin`.


        After a successful login, it returns the `apiKey` a Json web token [RFC7519](https://datatracker.ietf.org/doc/html/rfc7519)
        that MUST be added to the Authentication Header of each request to authenticate
        the requesting user (`Authorization` as the key and the `apiKey` as the value).'
      operationId: login_post
      requestBody:
        content:
          application/json:
            examples:
              example:
                value:
                  password: proof_of_possession
                  user: admin
            schema:
              $ref: '#/components/schemas/UserCredentials'
        description: User credentials for login
      responses:
        '200':
          content:
            application/json:
              examples:
                success:
                  value:
                    apiKey: long-api-key-used-for-authorization
              schema:
                $ref: '#/components/schemas/APIKeyResponse'
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'
      security:
      - bodyAuth: []
      summary: Create API key for authorization
      tags:
      - Login
      x-stoplight:
        id: 7v9quxu70axk0
  /products:
    get:
      description: 'Get structured meta data of all products that are supported on
        the SERIES 64-IPM.


        The retrieved data as well as the schema of the open source product database
        are versioned using the [Semantic Versioning scheme](https://semver.org/).


        ### Products DB


        The product database contains smart home products along with meta-data used
        to describe a product in conjunction with the SERIES 64-IPM REST API.

        This section includes all necessary information from the product database
        required to work with the SERIES 64-IPM device.

        Therefore it contains all necessary meta data around the devices, e.g. what
        the valid ranges of a characteristic are and what characteristics a certain
        product consist of.


        #### FeatureObject Schema


        Features are the grouped functions of a product.

        They are defined by a unique, readable name that describes a specific combination
        of characteristics providing a specific functionality of the product.


        #### CharacteristicObject Schema


        Characteristics are atomic data values that provide functionality in conjunction
        with other characteristics of a feature.

        They can be categorized into three groups.


        **Infos** are characteristics holding non editable meta-data.


        **Settings** are characteristics that can configure a specific product.


        **Functions** are characteristics that contain the core functionality of a
        product.


        Dependent on the type of a characteristic the characteristicObject can contain
        additional fields.


        Each enum object is always specified by their string representation (key)
        and the corresponding numeric value (index).

        Clients MUST provide the string representation (key) of a characteristic within
        a REST API request.'
      operationId: products_get
      responses:
        '200':
          content:
            application/json:
              examples:
                product database:
                  value:
                    dataVersion: 0.1.0
                    products:
                    - category: sensor
                      channels: 1
                      features:
                      - characteristics:
                        - category: function
                          defaultValue: opened
                          enumerations:
                          - index: 0
                            key: opened
                          - index: 1
                            key: closed
                          identifier: motionDetected
                          readOnly: true
                          storageFrequency: always
                          type: enumeration
                          underlyingDataType: int
                        type: motion
                      - characteristics:
                        - category: function
                          defaultValue: '0'
                          identifier: illumination
                          maximum: 510
                          minimum: 0
                          readOnly: true
                          step: 2
                          storageFrequency: always
                          type: number
                          underlyingDataType: int
                          unit: Lx
                        - category: info
                          defaultValue: '0.0'
                          identifier: supplyVoltage
                          maximum: 5.1
                          minimum: 0
                          readOnly: true
                          step: 0.02
                          storageFrequency: always
                          type: number
                          underlyingDataType: float
                          unit: V
                        type: illumination
                      name: FBH55SB
                      productGuid: 3ccc1548-d935-43bf-aa12-c99b1a48da20
                      profile: motionIllumination
                    - category: sensor
                      channels: 1
                      features:
                      - characteristics:
                        - category: function
                          defaultValue: opened
                          enumerations:
                          - index: 0
