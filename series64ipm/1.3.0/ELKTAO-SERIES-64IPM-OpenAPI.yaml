paths:
  /.well-known/eltako/devices:
    get:
      description: 'The `.well-known` endpoint provides information about the device.


        Following the well-known URI guidelines according to RFC 5785, it is always
        accessible under the identical path {baseUrl}/.well-known/eltako/devices,
        regardless of the REST API version.


        This request does not require any authorization as it is supposed to be public
        and reachable without having to know anything about the server.'
      operationId: well_known_get
      responses:
        '200':
          content:
            application/json:
              examples:
                Well-known response:
                  value:
                    api:
                      services:
                      - name: eltako
                        version: 0.0.1
                      version: 0.4.0
                    compatibleApps: []
                    concurrentConnections: null
                    concurrentRequests: false
                    preferredApp:
                      downloadUrls:
                        android: https://play.google.com/store/apps/details?id=com.eltako.connect
                        ios: https://apps.apple.com/de/app/eltako-connect/id1622689879
                      name: Eltako Connect
                    supportedApis: []
              schema:
                $ref: '#/components/schemas/WellKnown'
          description: OK
          headers:
            Content-Length:
              $ref: '#/components/headers/ContentLength'
            Content-Type:
              $ref: '#/components/headers/ContentType'
            Warning:
              $ref: '#/components/headers/Warning'
      security: []
      servers:
      - description: Relative .well-known endpoint on the device
        url: ''
      - description: Base URL used for .well-known endpoint(s)
        url: '{protocol}://{host}:{port}'
        variables:
          host:
            default: 192.168.8.196
            description: IP address of the ELTAKO IP device
          port:
            default: '443'
            description: Port under which the ELTAKO IP device is addressable
          protocol:
            default: https
            description: Protocol of the URI under which the ELTAKO IP device is addressable
      summary: Get some information about the API
      tags:
      - Well-known - General API Information
      x-stoplight:
        id: qfqe0dwusw732
    parameters: []
  /devices:
    delete:
      description: Delete all devices that are not linked to a service device.
      operationId: delete-devices
      responses:
        '200':
          $ref: '#/components/responses/OK'
        '400':
          $ref: '#/components/responses/BadRequest'
      security:
      - apikeyAuth: []
      summary: Delete all devices that are not linked to a service device.
      tags:
      - Devices
    get:
      description: 'Get a list of all available devices.


        A device is controlled by its characteristics. Each characteristic consists
        of an `identifier`, the current `value` and a corresponding `type`.


        Further information about how to request possible values (ranges), enum cases
        and more can be found in the `/products` endpoint description.


        ## Devices

        A device in the context of an SERIES 64-IPM is defined as a generic container
        of atomic characteristics tied to a product.

        It does not necessarily have to be attached to a physical device.

        Attachement to a physical device is always realized through the linkage to
        a service device.

        For more information about service devices please refer to the API: Services
        section.


        A device can be used to drive the automation system of the SERIES 64-IPM device.

        For more information please refer to the API: ELTAKO Basic Automation section.

        At the root level a device consists of three elements:

        - `deviceGuid` is used to globally identify the device.

        - `productGuid` describes the structure of a device along with the required
        characteristics. For more information please refer to the `/products` endpoint.

        - `displayName` MAY be used to identify the device with a human-readable string.


        Multiple automations or service devices MAY be related to a single device
        entity.

        In addition to these elements, a device consists of characteristics that are
        divided into the categories `Infos`, `Settings` and `Functions`.


        ### Characteristics

        A characteristic describes an atomic partial functionality of a device. Characteristics
        can be of type number (Integers or floating point numbers (signed and unsigned))
        or enumeration.

        Booleans are represented as enumerations to ensure extensibility.

        Other characteristic types MAY be included in future versions of this API.

        In addition, each characteristic contains an identifier and a value field.

        The identifier field can be used in combination with the product database
        (please refer to the API: Products section of this documentation to obtain
        meta information such as valid ranges, unit description, default values or
        enumeration values).

        The value property contains the characteristic type specific value of the
        characteristic.

        It can be of type string for enumeration typed characteristics or number for
        number typed characteristics.


        #### Functions

        Function characteristics represent the core functionality of the device. They
        MAY be read only.


        #### Infos

        Info characteristics provide non editable information about a device that
        do not represent the core functionality of the device, but instead additional
        information such as meta data.


        #### Settings

        Some devices can be configured.

        Setting characteristics configure the behavior of a device.

        They MUST always be editable.

        Possible options (like min and max values) appear in this list and can be
        altered.'
      operationId: devices_get
      parameters:
      - $ref: '#/components/parameters/Connection'
      responses:
        '200':
          content:
            application/json:
              examples:
                ESB62NP-IP:
                  value:
                  - deviceGuid: f2765aae-55e8-4233-a7b0-3222c3566032
                    displayName: ELTAKO-ESB62NP-IP/110-240V
                    functions:
                    - identifier: targetPosition
                      type: number
                      value: 0
                    infos:
                    - identifier: currentPosition
                      type: number
                      value: 0
                    - identifier: maxRuntime
                      type: number
                      value: 120000
                    - identifier: power
                      type: number
                      value: 0
                    productGuid: 0b898240-e820-4a06-879a-fccf35260a35
                    settings:
                    - identifier: runtimeMode
