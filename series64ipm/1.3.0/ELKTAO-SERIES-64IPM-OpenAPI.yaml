    DirectionalDownButtonDimmerLogicConfiguration:
      description: With the directional down button, the light dims down till it is
        off by briefly pressing the button./nLong button presses dim the device towards
        the minimumBrightness./nThe only supported extension is the slumberExtension
      examples:
      - dimDuration: 7000
