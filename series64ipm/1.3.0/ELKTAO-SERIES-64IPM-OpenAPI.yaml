                    - identifier: inputChannel1
                      type: enumeration
                      value: opened
                    - identifier: inputChannel2
                      type: enumeration
                      value: opened
                    - identifier: inputBridged
                      type: enumeration
                      value: opened
                    infos: []
                    productGuid: 52d055e8-4bf4-4583-a9d8-5672bb36dbcf
                    settings: []
                ESB64NP-IPM:
                  value:
                  - deviceGuid: ab7416ed-2947-4ea2-bbac-0d0370157816
                    displayName: ELTAKO-ESB64NP-IPM
                    functions:
                    - identifier: targetPosition
                      type: number
                      value: 0
                    - identifier: targetTilt
                      type: number
                      value: 0
                    infos:
                    - identifier: currentPosition
                      type: number
                      value: 0
                    - identifier: maxRuntime
                      type: number
                      value: 120000
                    - identifier: currentTilt
                      type: number
                      value: 0
                    - identifier: power
                      type: number
                      value: 0
                    productGuid: 2b046bb5-6bcd-4d41-9c5c-01bac63ebc1d
                    settings:
