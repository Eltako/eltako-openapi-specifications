components:
  headers:
    ContentLength:
      description: The length of the content being sent in the body of the request.
      schema:
        example: 328
        type: integer
    ContentType:
      description: The media type of the resource being sent in the body of the request.
      schema:
        examples:
        - application/octet-stream
        - application/json
        - application/hap+json
        - application/problem+json
        type: string
    TransferEncoding:
      description: The encoding of the content being sent in the body of the request.
      schema:
        examples:
        - chunked
        type: string
    Warning:
      description: Warning provided in headers
      schema:
        examples:
        - Please note that this version of the API is prerelease, not supported and
          expected to change a lot silently with device updates in the near future!
        type: string
  parameters:
    Connection:
      description: The status of network connection.
      example: connected
      in: header
      name: Connection
      required: true
      schema:
        type: string
    ContentType:
      description: The media type of the resource being sent in the body of the request.
      in: header
      name: Content-Type
      schema:
        examples:
        - application/octet-stream
        - application/json
        - application/hap+json
        - application/problem+json
        type: string
    automationGuid:
      description: A globally unique identifier for an automation configuration within
        the SERIES 64-IPM device.
      example: 323e4567-e89b-12d3-a456-426614174000
      in: path
      name: automationGuid
      required: true
      schema:
        format: uuid
        type: string
    deviceGuid:
      description: A globally unique identifier for a device managed by the SERIES
        64-IPM device.
      in: path
      name: deviceGuid
      required: true
      schema:
        examples:
        - 123e4567-e89b-12d3-a456-426614174000
        format: uuid
        type: string
    hardwareConfigurationGuid:
      description: A hardware configuration guid.
      in: path
      name: hardwareConfigurationGuid
      required: true
      schema:
        examples:
        - 123e4567-e89b-12d3-a456-426614174000
        format: uuid
        type: string
    identifier:
      description: An identifier used to identify a resource such as a characteristic.
      example: runtimeMode
      in: path
      name: identifier
      required: true
      schema:
        type: string
    serviceDeviceGuid:
      description: A virtual device guid.
      in: path
      name: serviceDeviceGuid
      required: true
      schema:
        examples:
        - 123e4567-e89b-12d3-a456-426614174000
        format: uuid
        type: string
    userName:
      description: A user name used for authentication.
      example: admin
      in: path
      name: userName
      required: true
      schema:
        type: string
  responses:
    Accepted:
      content:
        application/json:
          examples:
            factory_reset:
              value:
                detail: The factory reset will be performed in 15 seconds
                status: 202
                title: Accepted
            update_device:
              value:
                detail: Accepted request to change device. Processing 1 found changes.
                status: 202
                title: Accepted
          schema:
            $ref: '#/components/schemas/ResponseItem'
      description: Accepted
      headers:
        Content-Length:
          $ref: '#/components/headers/ContentLength'
        Content-Type:
          $ref: '#/components/headers/ContentType'
    BadRequest:
      content:
        application/problem+json:
          examples:
            bad_request:
              value:
                detail: Bad request. The request message was structured incorrectly.
                instance: /api/v0/devices/abcdef12-3456-7890-abcd-ef1234567890
                status: 400
                title: Bad Request
          schema:
            $ref: '#/components/schemas/ResponseItem'
      description: Bad Request
      headers:
        Content-Length:
          $ref: '#/components/headers/ContentLength'
        Content-Type:
          $ref: '#/components/headers/ContentType'
    Conflict:
      content:
        application/problem+json:
          examples:
            conflict:
              value:
                detail: ''
                instance: /api/v0/update/firmware
                status: 409
                title: Conflict
          schema:
            $ref: '#/components/schemas/ResponseItem'
      description: Conflict
      headers:
        Content-Length:
          $ref: '#/components/headers/ContentLength'
        Content-Type:
          $ref: '#/components/headers/ContentType'
    EntitiyTooLarge:
      content:
        application/problem+json:
          examples:
            too_large:
              value:
                detail: ''
                instance: /api/v0/update/firmware
                status: 413
                title: Request Entry Too Large
          schema:
            $ref: '#/components/schemas/ResponseItem'
      description: Request Entity Too Large
      headers:
        Content-Length:
          $ref: '#/components/headers/ContentLength'
        Content-Type:
          $ref: '#/components/headers/ContentType'
    Generic:
      content:
        application/json:
          examples:
            generic:
              value:
                detail: ''
                instance: /api/v0/generic/endpoint
                status: 200
                title: Generic
          schema:
            $ref: '#/components/schemas/ResponseItem'
      description: Generic Response
      headers:
        Content-Length:
          $ref: '#/components/headers/ContentLength'
        Content-Type:
          $ref: '#/components/headers/ContentType'
    Gone:
      content:
        application/problem+json:
          examples:
            gone:
              value:
                detail: ''
                instance: /api/v0/update/firmware
                status: 410
                title: Gone
          schema:
            $ref: '#/components/schemas/ResponseItem'
      description: Gone
      headers:
        Content-Length:
          $ref: '#/components/headers/ContentLength'
        Content-Type:
          $ref: '#/components/headers/ContentType'
    InternalServerErr:
      content:
        application/problem+json:
          examples:
            internal_err:
              value:
                detail: ''
                instance: /api/v0/update/firmware
                status: 500
                title: Internal Server Error
          schema:
            $ref: '#/components/schemas/ResponseItem'
      description: Internal Server Error
      headers:
        Content-Length:
          $ref: '#/components/headers/ContentLength'
        Content-Type:
          $ref: '#/components/headers/ContentType'
    NotFound:
      content:
        application/problem+json:
          examples:
            not_found:
              value:
                detail: Requested deviceGuid not found.
                instance: /api/v0/devices/abcdef12-3456-7890-abcd-ef1234567890
                status: 404
                title: Not Found
          schema:
            $ref: '#/components/schemas/ResponseItem'
      description: Not Found
      headers:
        Content-Length:
          $ref: '#/components/headers/ContentLength'
        Content-Type:
          $ref: '#/components/headers/ContentType'
    OK:
      content:
        application/json:
          examples:
            firmware_update:
              value:
                detail: Firmware upload succeeded
                instance: /api/v0/update/firmware
                status: 200
                title: OK
          schema:
            $ref: '#/components/schemas/ResponseItem'
      description: OK
      headers:
        Content-Length:
          $ref: '#/components/headers/ContentLength'
        Content-Type:
          $ref: '#/components/headers/ContentType'
    ServiceUnavailable:
      content:
        application/problem+json:
          examples:
            service_unavailable:
              value:
                detail: ''
                instance: /api/v0/update/firmware
                status: 503
                title: Service Unavailable
          schema:
            $ref: '#/components/schemas/ResponseItem'
      description: Service Unavailable
      headers:
        Content-Length:
          $ref: '#/components/headers/ContentLength'
        Content-Type:
          $ref: '#/components/headers/ContentType'
    TooManyRequests:
      content:
        application/problem+json:
          examples:
            too_many_req:
              value:
                detail: ''
                instance: /api/v0/update/firmware
                status: 429
                title: Too Many Requests
          schema:
            $ref: '#/components/schemas/ResponseItem'
      description: Too Many Requests
      headers:
        Content-Length:
          $ref: '#/components/headers/ContentLength'
        Content-Type:
          $ref: '#/components/headers/ContentType'
    Unauthorized:
      content:
        application/problem+json:
          examples:
            deviceguid:
              summary: 400 Bad Request - device guid not found
              value:
                detail: Device not found for provided DeviceGUID
                instance: /api/v0/services/eltako/automation
                status: 400
                title: Bad Request
            logic:
              summary: 400 Bad Request - logic not supported
              value:
                detail: Provided string button cannot be parsed into a logic
                instance: /api/v0/services/eltako/automation
                status: 400
                title: Bad Request
            login:
              value:
                detail: Credentials incorrect. Cannot authenticate user
                instance: /api/v0/login
                status: 401
                title: Unauthorized
          schema:
            $ref: '#/components/schemas/ResponseItem'
      description: Unauthorized
      headers:
        Content-Length:
          $ref: '#/components/headers/ContentLength'
        Content-Type:
          $ref: '#/components/headers/ContentType'
      x-stoplight:
        id: io9ffedstv65o
  schemas:
    APIKeyResponse:
      description: API key that is needed for any other endpoint authentification.
      examples:
      - apiKey: AF53E6DF-BF94-49AC-A14E-F1F1A05DA17C
      properties:
        apiKey:
          description: API key
          example: AF53E6DF-BF94-49AC-A14E-F1F1A05DA17C
          type: string
          x-faker:
            random.alphaNumeric: 32
      type: object
      x-stoplight:
        id: 4jjpsher8epkc
    APIObject:
      description: API version and supported services
      example:
        services:
        - name: service1
          version: 1.0.0
        version: 1.0.0
      properties:
        services:
          description: An array which holds service objects
          examples:
          - - name: service1
              version: 1.0.0
          items:
            $ref: '#/components/schemas/ServiceObject'
          type: array
        version:
          $ref: '#/components/schemas/VersionObject'
      type: object
      x-stoplight:
        id: 5gt758a8u6w6l
    ActuatorServiceDevice:
      description: Actuator service device
      examples:
      - deviceGuid: 123e4567-e89b-12d3-a456-426614174000
        hardwareConfigurationGuid: 123e4567-e89b-12d3-a456-426614174000
        productGuid: 223e4567-e89b-12d3-a456-426614174000
        serviceDeviceGuid: null
      properties:
        available:
          description: Indicates whether the actuator configuration is available or
            not
          example: true
          type: boolean
        blockedBy:
          anyOf:
          - type: 'null'
          - description: List of hardware configurations that block this actuator
              configuration
            example: []
            items:
              $ref: '#/components/schemas/ServiceDeviceGuid'
            type: array
        description:
          description: Description of the actuator hardware configuration
          example: Single channel dimmer
          type: string
        deviceGuid:
          anyOf:
          - $ref: '#/components/schemas/DeviceGuid'
          - type: 'null'
        hardwareConfigurationGuid:
          $ref: '#/components/schemas/UUID'
        productGuid:
          $ref: '#/components/schemas/ProductGuid'
        serviceDeviceGuid:
          anyOf:
          - $ref: '#/components/schemas/ServiceDeviceGuid'
          - type: 'null'
      required:
      - productGuid
      - deviceGuid
      type: object
      x-stoplight:
        id: a2c7423fce07a
    AppLinkObject:
      description: Download links for different platforms (optional)
      example:
        android: https://play.google.com/store/apps/details?id=com.eltako.connect
        ios: https://apps.apple.com/de/app/eltako-connect/id1622689879
      properties:
        android:
          description: Android play store link (optional)
          example: https://play.google.com/store/apps/details?id=com.eltako.connect
          type: string
        ios:
          description: iOS app store link (optional)
          example: https://apps.apple.com/de/app/eltako-connect/id1622689879
          type: string
      type: object
      x-stoplight:
        id: behq6nnqt7uu8
    AppObject:
      description: Preferred app to use this device with
      example:
        downloadUrls:
          android: https://play.google.com/store/apps/details?id=com.eltako.connect
          ios: https://apps.apple.com/de/app/eltako-connect/id1622689879
        name: ELTAKO Connect
      properties:
        downloadUrls:
          $ref: '#/components/schemas/AppLinkObject'
        name:
          description: Name of the app
          example: ELTAKO Connect
          type: string
      type: object
      x-stoplight:
        id: ux9h2gbl1ao37
    AutomationObject:
      description: Automation configuration
      example:
        configuration:
          addOns: []
          automationGuid: ddeeff12-3456-7890-abcd-ef1234567890
          inputCharacteristicIdentifier: inputChannel1
          inputDeviceGuid: abcdef12-3456-7890-abcd-ef1234567890
          logic: universalButtonDimmer
          logicConfiguration:
            childrenRoomExtension:
              dimDuration: 7000
              enabled: true
              targetBrightness: 100
            dimDuration: 7000
            slumberExtension:
              dimDuration: 1800000
              enabled: true
            turnOffDuration: 2000
            turnOnDuration: 2000
          outputCharacteristicIdentifier: targetBrightness
          outputDeviceGuid: abc520fc-3456-7890-abcd-ef1234567890
        description: Default universalButtonDimmer automation
        enabled: true
      properties:
        configuration:
          $ref: '#/components/schemas/Configuration'
        description:
          description: Human-readable explanation of automation.
          example: Default universalButtonDimmer automation
          type: string
        enabled:
          description: Flag that indicates whether the rule should be evaluated.
          type: boolean
      type: object
      x-stoplight:
        id: mjj947xae2dg7
    AutomationResponse:
      allOf:
      - $ref: '#/components/schemas/AutomationObject'
      - $ref: '#/components/schemas/AutomationStatus'
      description: Automation response
      examples:
      - configuration:
          addOns: []
          automationGuid: ddeeff12-3456-7890-abcd-ef1234567890
          inputCharacteristicIdentifier: inputChannel1
          inputDeviceGuid: abcdef12-3456-7890-abcd-ef1234567890
          logic: universalButtonDimmer
          logicConfiguration:
            childrenRoomExtension:
              dimDuration: 7000
              enabled: true
              targetBrightness: 100
            dimDuration: 7000
            slumberExtension:
              dimDuration: 1800000
              enabled: true
            turnOffDuration: 2000
            turnOnDuration: 2000
          outputCharacteristicIdentifier: targetBrightness
          outputDeviceGuid: abc520fc-3456-7890-abcd-ef1234567890
        description: Default universalButtonDimmer automation
        enabled: true
        errors: []
        operatingStatus: success
      type: object
      x-stoplight:
        id: p1f25wpaa332y
    AutomationStatus:
      description: Automation status
      examples:
      - errors: []
        operatingStatus: success
      properties:
        errors:
          description: List of errors.
          example: []
          items:
            description: Automation Status Errors
            example:
              code: 404
              description: Input device not found
              title: Input device not found
            properties:
              code:
                description: An error code similar to http status codes
                oneOf:
                - const: 404
                  description: A dependency of the automation is missing
                  title: Not found
                - const: 409
                  description: Automation produces conflicts
                  title: Conflict
                - const: 500
                  description: A generic, catch all error
                  title: Generic
                type: number
              description:
                description: A human readable description of the error
                example: Input device not found
                type: string
              title:
                description: The title of the error
                example: Input device not found
                type: string
            type: object
          type: array
        operatingStatus:
          description: String indicating if the status is success or failure.
          examples:
          - success
          - failure
          type: string
          x-faker:
            random.arrayElement:
            - - success
              - failure
      type: object
    BinaryData:
      description: Binary data for the firmware update
      example: '0x1234567890abcdef'
      format: binary
      type: string
      x-stoplight:
        id: xg1rf5gacelyv
    Category:
      description: Describes the type of product, especially whether it is an actuator
        or a sensor.
      example: actuator
      type: string
      x-stoplight:
        id: goewrcoz1j2ta
    CentralDownButtonDimmerLogicConfiguration:
      description: With the central down button, the light always dims down till it
        is off by pressing the button./nThere are no extensions supported
      examples:
      - turnOffDuration: 2000
      properties:
        turnOffDuration:
          description: Time in milli-seconds it takes for a full cycle dimming from
            0% - 100%./nThis will be used to determine how fast the dimmer should
            turn off after clicking
          examples:
          - 2000
          maximum: 4294967295
          minimum: 200
          type: number
      type: object
    CentralUpButtonDimmerLogicConfiguration:
      description: With the central up button, the light always dims up to the maximumBrightness
        by pressing the button./nThere are no extensions supported
      examples:
      - turnOnDuration: 2000
      properties:
        turnOnDuration:
          description: Time in milli-seconds it takes for a full cycle dimming from
            0% - 100%./nThis will be used to determine how fast the dimmer should
            go to last brightness after clicking
          examples:
          - 2000
          maximum: 4294967295
          minimum: 200
          type: number
      type: object
    Certificate:
      description: Certificate for device
      examples:
      - eta: 600
      properties:
        eta:
          description: ETA TODO
          examples:
          - 600
          type: number
      type: object
      x-stoplight:
        id: 099ehpyg5v2gb
    CertificateUpdate:
      description: Certificate for device
      examples:
      - cert: insert_certificate_here
      properties:
        cert:
          description: Certificate TODO
          examples:
          - insert_certificate_here
          type: string
      type: object
      x-stoplight:
        id: 3o6rmk36s7tkb
    Channel:
      description: Represents a channel within a matter device. A channel is a logical
        grouping of characteristics that are related to each other.
      examples:
      - enabled: true
        endpointId: 1
        feature: momentarySwitch
        identifier: targetBrightness
      properties:
        enabled:
          description: Indicates whether the channel is enabled or not
          example: true
          type: boolean
        endpointId:
          description: Represents the matter endpoint ID (part of the address within
            the matter network)
          example: 1
          type: integer
        feature:
          description: Feature for matter generic switch
          examples:
          - momentarySwitch
          - latching
          type: string
        identifier:
          description: Represents the characteristic identifier within this mapping
          example: targetBrightness
          type: string
        startUpCurrentLevel:
          description: "This is a Matter specific value. It can also be set using\
            \ the Matter API.\nIt is the level the device should have on startup.\n\
            The following values are supported:\n  - \"null\": start device with previous\
            \ value\n  - 0: start device with lowest permitted level of the device\n\
            \  - 1-254: start device with given level"
          example: 0
          maximum: 254
          minimum: 0
          type: integer
        startUpOnOff:
          description: "This is a Matter specific value. It can also be set using\
            \ the Matter API.\nThe following values are supported:\n  - \"null\":\
            \ start with the previous value\n  - 0: start switched off\n  - 1: start\
            \ switched on\n  - 2: start with the opposite of the previous value (toggle)"
          example: 0
          type: integer
      required:
      - identifier
      - enabled
      type: object
      x-stoplight:
        id: ddc9482a7b7f3
    Channels:
      description: Matter channels to configure
      examples:
      - channels:
        - enabled: true
          endpointId: 1
          feature: momentarySwitch
          identifier: targetBrightness
      properties:
        channels:
          items:
            $ref: '#/components/schemas/Channel'
      type: object
      x-stoplight:
        id: 54xoq25w08a28
    Characteristic:
      description: Device characteristic
      examples:
      - identifier: currentBrightness
        type: number
        value: 68
      properties:
        identifier:
          description: Unique identifier for the characteristic specified within the
            product database.
          examples:
          - currentBrightness
          type: string
        type:
          description: Discriminator to specify the Characteristic.
          examples:
          - number
          - enumeration
          - string
          type: string
          x-faker:
            random.arrayElement:
            - - number
              - enumeration
              - string
        value:
          anyOf:
          - description: Current value (number)
            example: 68
            type: number
          - description: Some string if property type is string or a predefined string
              if property type is enumeration
            examples:
            - The name of the device
            - 'off'
            type: string
          - description: Current value (boolean)
            example: true
            type: boolean
          description: Value of the characteristic
      type: object
      x-stoplight:
        id: r5a9xy73vzivf
    CharacteristicObject:
      description: Meta-data for individual characteristics a certain feature is composed
        of.
      examples:
      - category: setting
        defaultValue: '0'
        enums: []
        identifier: targetBrightness
        maximum: 100
        minimum: 0
        readOnly: false
        step: 1
        storageFrequency: always
        type: number
        underlyingDataType: u8
        unit: '%'
      properties:
        category:
          description: Holds information whether the characteristic can be categorized
            as an info, setting or function characteristic.
          example: setting
          type: string
        defaultValue:
          description: Denotes the default value of a characteristic in conjunction
            with its product.
          example: '0'
          type: string
        enums:
          $ref: '#/components/schemas/EnumObject'
        identifier:
          description: Descriptive name that uniquely identifies a characteristic
            within the scope of an individual product.
          example: targetBrightness
          type: string
        maximum:
          description: Maximum valid numeric value the characteristic can be assigned
            to.
          example: 100
          type: number
        minimum:
          description: Minimum valid numeric value the characteristic can be assigned
            to.
          example: 0
          type: number
        readOnly:
          description: Denotes whether the characteristic is editable via REST API
            or not.
          example: false
          type: boolean
        step:
          description: Specifies the increments at which the characteristic can assume
            values.
          example: 1
          type: number
        storageFrequency:
          default: always
          description: Denotes the frequency with which the characteristics value
            is stored under the filesystem of the product.
          example: always
          type: string
        type:
          description: Distinctive field that specifies what type of metadata the
            particular characteristic consists of.
          example: number
          type: string
        underlyingDataType:
          description: Describes the underlying data type of a characteristic.
          example: u8
          type: string
        unit:
          description: Descriptive, human-readable abbreviation for the unit that
            the number characteristic assumes.
          example: '%'
          type: string
      type: object
      x-stoplight:
        id: l8edrr5dn871w
    Configuration:
      description: Configuration of automation.
      example:
        addOns: []
        automationGuid: ddeeff12-3456-7890-abcd-ef1234567890
        inputCharacteristicIdentifier: input
        inputDeviceGuid: abcdef12-3456-7890-abcd-ef1234567890
        logic: universalButtonDimmer
        logicConfiguration:
          childrenRoomExtension:
            dimDuration: 7000
            enabled: true
            targetBrightness: 100
          dimDuration: 7000
          slumberExtension:
            dimDuration: 1800000
            enabled: true
          turnOffDuration: 2000
          turnOnDuration: 2000
        outputCharacteristicIdentifier: targetBrightness
        outputDeviceGuid: abc520fc-3456-7890-abcd-ef1234567890
      properties:
        addOns:
          description: AddOns provide additional information to extend the behavior
            of automations by different parameters.
          examples:
          - - data: 11
              type: targetValue
            - time: 1000
              type: time
          items:
            examples:
            - data: 11
              type: targetValue
            - time: 1000
              type: time
            properties:
              data:
                description: Value
                examples:
                - 11
                type:
                - number
                - 'null'
              time:
                description: Time in milli-seconds
                examples:
                - 1000
                maximum: 100000
                minimum: 0
                type:
                - number
                - 'null'
              type:
                description: Type of Addon
                examples:
                - targetValue
                type: string
            type: object
          type: array
        automationGuid:
          $ref: '#/components/schemas/UUID'
        inputCharacteristicIdentifier:
          $ref: '#/components/schemas/Identifier'
        inputDeviceGuid:
          $ref: '#/components/schemas/UUID'
        logic:
          description: Human-readable designator for a behavior between an input device
            and an output device.
          examples:
          - buttonImpulseSwitch
          - buttonToggleSwitch
          type: string
        logicConfiguration:
          description: Depends on the selected logic
          oneOf:
          - $ref: '#/components/schemas/UniversalButtonDimmerLogicConfiguration'
          - $ref: '#/components/schemas/DirectionalUpButtonDimmerLogicConfiguration'
          - $ref: '#/components/schemas/DirectionalDownButtonDimmerLogicConfiguration'
          - $ref: '#/components/schemas/CentralUpButtonDimmerLogicConfiguration'
          - $ref: '#/components/schemas/CentralDownButtonDimmerLogicConfiguration'
          - $ref: '#/components/schemas/SceneButtonDimmerLogicConfiguration'
        outputCharacteristicIdentifier:
          $ref: '#/components/schemas/Identifier'
        outputDeviceGuid:
          $ref: '#/components/schemas/UUID'
      type: object
      x-stoplight:
        id: 1xrz71vizqy0t
    DeviceCreationInfo:
      description: Device information for creation of a new device
      examples:
      - deviceGuid: 123e4567-e89b-12d3-a456-426614174000
        displayName: My device
        productGuid: 223e4567-e89b-12d3-a456-426614174000
